name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test -- --coverage
      - run: pnpm build
        env: { CV_BASE: /cryventure/ }
      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with: { name: site-preview, path: apps/web/dist, retention-days: 7 }
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
        env: { HOME: /root }
      - run: pnpm --filter @cryventure/web e2e:subpath
        env: { HOME: /root }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile -t cryventure:ci .
      - name: Smoke test container
        run: |
          docker run -d --rm --read-only --tmpfs /tmp -p 8080:8080 --name cv cryventure:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/en/ | grep -q CryVenture
          curl -fsS http://localhost:8080/de/ | grep -q CryVenture
          curl -fsSI http://localhost:8080/en/ | grep -qi content-security-policy
          docker stop cv
